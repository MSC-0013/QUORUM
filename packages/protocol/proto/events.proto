syntax = "proto3";

package quorum.events.v1;

message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  uint32 schema_version = 3;
  string aggregate_id = 4;
  uint64 sequence = 5;
  string producer = 6;
  string partition_key = 7;
  string trace_id = 8;
  string project_id = 9;
  string cluster_id = 10;
  string experiment_id = 11;
  string run_id = 12;
  string occurred_at = 13;
  bytes payload = 14;
}

message OperationLoggedEvent {
  string run_id = 1;
  string operation_id = 2;
  string client_id = 3;
  string node_id = 4;
  uint64 invoke_mono_ns = 5;
  uint64 return_mono_ns = 6;
  uint64 invoke_timeline_ns = 7;
  uint64 return_timeline_ns = 8;
  int64 wall_time_ms = 9;
  string op_type = 10;
  string key = 11;
  bytes arguments = 12;
  bytes result = 13;
  string outcome = 14;
}
