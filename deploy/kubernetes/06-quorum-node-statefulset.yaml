apiVersion: v1
kind: Service
metadata:
  name: quorum-node-headless
  namespace: quorum-lab
  labels:
    app: quorum-node
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 50051
      name: grpc-node
      targetPort: 50051
  selector:
    app: quorum-node
---
apiVersion: v1
kind: Service
metadata:
  name: quorum-node
  namespace: quorum-lab
  labels:
    app: quorum-node
spec:
  type: ClusterIP
  ports:
    - port: 50051
      name: grpc-node
      targetPort: 50051
  selector:
    app: quorum-node
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quorum-node
  namespace: quorum-lab
  labels:
    app: quorum-node
spec:
  serviceName: "quorum-node-headless"
  replicas: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app: quorum-node
  template:
    metadata:
      labels:
        app: quorum-node
    spec:
      serviceAccountName: quorum-node-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: quorum-node
          image: quorum-lab/quorum-node:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: "production"
            - name: GRPC_PORT
              value: "50051"
            - name: GRPC_HOST
              value: "0.0.0.0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DATA_DIR
              value: "/data"
            - name: CLUSTER_SIZE
              value: "3"
            - name: HEADLESS_SERVICE
              value: "quorum-node-headless.quorum-lab.svc.cluster.local"
          ports:
            - containerPort: 50051
              name: grpc-node
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            grpc:
              port: 50051
              service: quorum.node.v1.NodeService
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          livenessProbe:
            grpc:
              port: 50051
              service: quorum.node.v1.NodeService
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50051
              service: quorum.node.v1.NodeService
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: quorum-data
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: quorum-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
