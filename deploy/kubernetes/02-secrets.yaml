apiVersion: v1
kind: Secret
metadata:
  name: quorum-secrets
  namespace: quorum-lab
type: Opaque
stringData:
  # Database Credentials (no plaintext in repository/manifests)
  MYSQL_DATABASE: "quorum_lab"
  MYSQL_USER: "quorum_admin"
  MYSQL_PASSWORD: "CHANGE_ME_PRODUCTION_DB_PASSWORD"
  MYSQL_HOST: "mysql.quorum-lab.svc.cluster.local"
  MYSQL_PORT: "3306"

  # Redis Credentials (for distributed lease / lock coordinator)
  REDIS_HOST: "redis.quorum-lab.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "CHANGE_ME_PRODUCTION_REDIS_PASSWORD"

  # Kafka Credentials (event streaming bus)
  KAFKA_BROKERS: "kafka-0.kafka-headless.quorum-lab.svc.cluster.local:9092,kafka-1.kafka-headless.quorum-lab.svc.cluster.local:9092"
  KAFKA_SASL_USERNAME: "quorum_producer"
  KAFKA_SASL_PASSWORD: "CHANGE_ME_PRODUCTION_KAFKA_PASSWORD"

  # Internal Auth & Encryption Keys
  CLUSTER_SECRET_KEY: "CHANGE_ME_INTERNAL_HMAC_SECRET"
