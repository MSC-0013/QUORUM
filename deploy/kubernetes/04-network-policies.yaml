apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quorum-node-network-policy
  namespace: quorum-lab
spec:
  podSelector:
    matchLabels:
      app: quorum-node
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow gRPC inter-node replication and Raft traffic from peer nodes
    - from:
        - podSelector:
            matchLabels:
              app: quorum-node
      ports:
        - protocol: TCP
          port: 50051
    # Allow gRPC client requests and fault control from control-api
    - from:
        - podSelector:
            matchLabels:
              app: quorum-control-api
      ports:
        - protocol: TCP
          port: 50051
    # Allow gRPC operations from experiment workers
    - from:
        - podSelector:
            matchLabels:
              app: quorum-worker
      ports:
        - protocol: TCP
          port: 50051
    # Allow metrics scraping from Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow outbound gRPC to other quorum nodes
    - to:
        - podSelector:
            matchLabels:
              app: quorum-node
      ports:
        - protocol: TCP
          port: 50051
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quorum-control-api-network-policy
  namespace: quorum-lab
spec:
  podSelector:
    matchLabels:
      app: quorum-control-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP REST API traffic from Ingress / Gateway
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow egress to quorum nodes
    - to:
        - podSelector:
            matchLabels:
              app: quorum-node
      ports:
        - protocol: TCP
          port: 50051
    # Allow egress to MySQL
    - ports:
        - protocol: TCP
          port: 3306
    # Allow egress to Redis
    - ports:
        - protocol: TCP
          port: 6379
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
