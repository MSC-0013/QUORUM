apiVersion: v1
kind: ServiceAccount
metadata:
  name: quorum-node-sa
  namespace: quorum-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quorum-control-api-sa
  namespace: quorum-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quorum-worker-sa
  namespace: quorum-lab
---
# Least-privilege role for Quorum Node: inspect headless peer endpoints
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quorum-peer-discovery-role
  namespace: quorum-lab
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quorum-node-discovery-binding
  namespace: quorum-lab
subjects:
  - kind: ServiceAccount
    name: quorum-node-sa
    namespace: quorum-lab
roleRef:
  kind: Role
  name: quorum-peer-discovery-role
  apiGroup: rbac.authorization.k8s.io
